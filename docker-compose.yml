# Omakaze: app + Postgres.
# 1. cp .env.example .env and fill in APP_SECRET (openssl rand -hex 32) and APP_URL
# 2. docker compose up -d
# 3. open http://localhost:3000 and create the first account (it becomes the instance admin)

name: omakaze

services:
  app:
    # Builds the image from this checkout. To run a published image instead, replace `build: .`
    # with `image: ghcr.io/tom-byrn/omakaze:latest` (see .github/workflows/release.yml).
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://omakaze:${POSTGRES_PASSWORD:-omakaze}@db:5432/omakaze
      # The server always listens on 3000 inside the container; PORT only changes the host port below.
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - app-data:/app/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: omakaze
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omakaze}
      POSTGRES_DB: omakaze
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omakaze -d omakaze"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app-data:
  db-data:
